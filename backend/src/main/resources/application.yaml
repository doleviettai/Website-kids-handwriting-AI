spring:
  application:
    name: kids-handwriting-backend
  config:
    import:
      - optional:file:./config/local.properties
      - optional:file:./backend/config/local.properties
      - optional:file:./config/local.yaml
      - optional:file:./backend/config/local.yaml
  datasource:
    url: jdbc:mysql://${DB_HOST:${db.host:127.0.0.1}}:${DB_PORT:${db.port:3306}}/${DB_NAME:${db.name:kids_handwriting}}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:${db.username:root}}
    password: ${DB_PASSWORD:${db.password:}}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    encoding: UTF-8
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
  bootstrap:
    admin:
      email: ${ADMIN_EMAIL:admin@netxinh.local}
      password: ${ADMIN_PASSWORD:admin123}
  ai:
    enabled: true
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
  scoring:
    shape: 0.3
    similarity: 0.3
    direction: 0.2
    stroke-order: 0.2
    positive-feedback: Bé đã hoàn thành bài viết! Mình cùng xem kết quả và tiếp tục luyện tập nhé.
